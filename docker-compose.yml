version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: servidor_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      redes2_net:
        ipv4_address: 58.17.0.2
    ports:
      - "8000:80"  

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: exporter_nginx
    command: -nginx.scrape-uri http://58.17.0.2/stub_status
    networks:
      redes2_net:
        ipv4_address: 58.17.0.10
    depends_on:
      - nginx

  apache:
    build: ./apache
    container_name: servidor_apache
    networks:
      redes2_net:
        ipv4_address: 58.17.0.3
    ports:
      - "8001:80"

  apache-exporter:
    image: bitnami/apache-exporter:latest
    container_name: exporter_apache
    command: --scrape_uri http://58.17.0.3/server-status/?auto
    networks:
      redes2_net:
        ipv4_address: 58.17.0.11
    depends_on:
      - apache

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      redes2_net:
        ipv4_address: 58.17.0.4
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      redes2_net:
        ipv4_address: 58.17.0.5
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:latest
    container_name: k6_load_tester
    volumes:
      - ./k6:/scripts
      - ./src:/src_data
    command: run /scripts/script.js
    networks:
      redes2_net:
        ipv4_address: 58.17.0.6

networks:
  redes2_net:
    driver: bridge
    ipam:
      config:
        - subnet: 58.17.0.0/24
          gateway: 58.17.0.1

volumes:
  grafana_data:
  